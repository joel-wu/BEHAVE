patch_sha256 = { "0001-training-runtime.patch" = "44bbdda1d4414e39deaf4575d4d62a402d226f058a79f479afdfa31474e8ab56" }
notes = "Combined experimental changes to 21 files, including Slime bootstrap patches."

[apex]
