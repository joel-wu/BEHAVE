# Source revisions and local patches captured from the experimental runtimes.
# Training entries were checked against the native environment on 2026-10-14;
# installed distribution versions are in infra/train/native_runtime.json.
# Apply each component's patch series once to its pinned commit. These combined
# training patches already include the Slime bootstrap changes present locally;
# do not apply the bootstrap's patch series a second time. This is source
# provenance, not a certified installer or a lock of compiled CUDA artifacts.

[slime]
upstream = "https://github.com/THUDM/slime.git"
commit = "a3f500977f33b82de6ac0414c0c43abfe656c3e0"
patches = []

[sglang]
upstream = "https://github.com/sgl-project/sglang.git"
commit = "0b3bb0cbe31873994c9f989fddfe2f87ca839fdd"
patches = ["0001-training-runtime.patch"]
patch_sha256 = { "0001-training-runtime.patch" = "39824840ecaafc84b62184dc53f4eb5a48dc9660882e5918cacfb335e22c9f08" }
notes = "Training checkout: 66 tracked changes and four additional source files. Not the separate evaluation checkout."

[megatron-lm]
upstream = "https://github.com/NVIDIA/Megatron-LM.git"
commit = "1dcf0dafa884ad52ffb243625717a3471643e087"
